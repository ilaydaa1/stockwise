server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to one address. Requests under /api are passed
    # to the backend container, so cookies stay same-origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (for example /app/products) are handled by
    # the single-page application.
    location / {
        try_files $uri /index.html;
    }
}
