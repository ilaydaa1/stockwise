name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockwise
          POSTGRES_PASSWORD: stockwise_ci_password
          POSTGRES_DB: stockwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwise -d stockwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests on SQLite
        run: pytest -q

      # The same suite again on the database used in production. This
      # is the run that exercises row locking and foreign keys.
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://stockwise:stockwise_ci_password@localhost:5432/stockwise_test
        run: pytest -q

  migrations:
    name: Migrations match models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockwise
          POSTGRES_PASSWORD: stockwise_ci_password
          POSTGRES_DB: stockwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwise -d stockwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_PASSWORD: stockwise_ci_password
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      - name: Check the schema matches the models
        run: alembic check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build
